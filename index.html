<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Sounds</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f0f0f">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f0f0f;
    color: #fff;
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  a {
    color: #ff0000;
  }
  button {
    font-size: 1.1rem;
    padding: 0.9em 1.6em;
    border: none;
    border-radius: 999px;
    background: #ff0000;
    color: #fff;
    font-weight: 600;
  }
  #status {
    text-align: center;
    padding: 0 1.5rem;
    line-height: 1.6;
  }
  .hint {
    display: block;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="status">Opening YouTube&hellip;</div>
<script>
  var VIDEO_ID = "2LMqOdCHQWw";
  var START_SECONDS = 9;

  // vnd.youtube: is a custom scheme owned exclusively by the YouTube app itself —
  // no browser registers a handler for it, so this can never silently fall
  // through to a browser tab the way intent:// with a fallback URL can.
  var appUrl = "vnd.youtube://www.youtube.com/watch?v=" + VIDEO_ID + "&t=" + START_SECONDS + "s";

  function launch() {
    window.location.href = appUrl;
  }

  var isStandalone = window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  // Attempt an automatic launch right away (works when the tap that opened this
  // page still counts as user activation). Always show a manual button too, since
  // that activation doesn't reliably carry over when launched from a home-screen icon.
  launch();

  if (isStandalone) {
    document.getElementById("status").innerHTML =
      '<button id="launchBtn">&#9654; Open in YouTube app</button>' +
      '<span class="hint">If nothing happened, tap the button above.</span>';
  } else {
    document.getElementById("status").innerHTML =
      '<button id="launchBtn">&#9654; Open in YouTube app</button>' +
      '<span class="hint">To install: tap &#8942; in Chrome &rarr; "Add to Home screen"</span>';
  }
  document.getElementById("launchBtn").addEventListener("click", launch);
</script>
</body>
</html>
