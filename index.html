<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Sounds</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f0f0f">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f0f0f;
    color: #fff;
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  a {
    color: #ff0000;
  }
  #tapIcon {
    font-size: 4rem;
    line-height: 1;
  }
  #status {
    text-align: center;
    padding: 0 1.5rem;
    line-height: 1.6;
  }
  #tapLabel {
    display: block;
    margin-top: 1.25rem;
    font-size: 1.3rem;
    font-weight: 600;
  }
  .hint {
    display: block;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="status">Opening YouTube&hellip;</div>
<script>
  var VIDEO_ID = "2LMqOdCHQWw";
  var START_SECONDS = 9;

  // vnd.youtube: is a custom scheme owned exclusively by the YouTube app itself —
  // no browser registers a handler for it, so this can never silently fall
  // through to a browser tab the way intent:// with a fallback URL can.
  var appUrl = "vnd.youtube://www.youtube.com/watch?v=" + VIDEO_ID + "&t=" + START_SECONDS + "s";

  function launch() {
    window.location.href = appUrl;
  }

  var isStandalone = window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  // Attempt an automatic launch right away (works when the tap that opened this
  // page still counts as user activation). Chrome requires a real in-page tap to
  // launch an external app scheme, and that activation doesn't carry over when
  // this page is opened by tapping a home-screen icon — so the whole screen
  // below also acts as a single big tap target, no button-hunting required.
  launch();

  var hint = isStandalone
    ? "If nothing happened, tap anywhere on this screen."
    : 'Tap anywhere to watch. To install: tap &#8942; in Chrome &rarr; "Add to Home screen"';

  document.getElementById("status").innerHTML =
    '<div id="tapIcon">&#9654;</div>' +
    '<span id="tapLabel">Tap to open YouTube app</span>' +
    '<span class="hint">' + hint + '</span>';

  document.body.addEventListener("click", launch);
</script>
</body>
</html>
