<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Sounds</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f0f0f">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f0f0f;
    color: #fff;
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  a {
    color: #ff0000;
  }
  button {
    font-size: 1.1rem;
    padding: 0.9em 1.6em;
    border: none;
    border-radius: 999px;
    background: #ff0000;
    color: #fff;
    font-weight: 600;
  }
  #status {
    text-align: center;
    padding: 0 1.5rem;
    line-height: 1.6;
  }
  .hint {
    display: block;
    margin-top: 1rem;
    font-size: 0.9rem;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="status">Opening YouTube&hellip;</div>
<script>
  var VIDEO_ID = "2LMqOdCHQWw";
  var START_SECONDS = 9;

  var webUrl = "https://www.youtube.com/watch?v=" + VIDEO_ID + "&t=" + START_SECONDS + "s";

  // Android: ask Chrome to hand off to the YouTube app directly.
  // Falls back to the web URL automatically if the app isn't installed.
  var intentUrl = "intent://www.youtube.com/watch?v=" + VIDEO_ID + "&t=" + START_SECONDS +
    "s#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=" +
    encodeURIComponent(webUrl) + ";end";

  function launch() {
    window.location.href = intentUrl;
  }

  // Only running as the installed home-screen app (standalone display mode)?
  // Then jump straight to the video. As a plain browser tab, auto-redirecting
  // immediately would prevent Chrome from ever offering "Add to Home screen" —
  // so show a manual launch button instead.
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (isStandalone) {
    launch();
    setTimeout(function () {
      document.getElementById("status").innerHTML =
        'Still here? <a href="' + webUrl + '">Tap to open the video</a>.';
    }, 1500);
  } else {
    document.getElementById("status").innerHTML =
      '<button id="launchBtn">&#9654; Watch video</button>' +
      '<span class="hint">To install: tap &#8942; in Chrome &rarr; "Add to Home screen"</span>';
    document.getElementById("launchBtn").addEventListener("click", launch);
  }
</script>
</body>
</html>
